[project]
name = "pixelforge-backend"
version = "0.1.0"
description = "PixelForge AI — FastAPI backend for Real-ESRGAN image upscaling"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.32,<1.0",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.5,<3.0",
  "python-multipart>=0.0.12",
  "sse-starlette>=2.1,<4.0",
  "sqlalchemy>=2.0,<3.0",
  "aiosqlite>=0.20",
  "alembic>=1.13,<2.0",
  "pillow>=10.4",
  "numpy>=1.26",
  "opencv-python-headless>=4.10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "ruff>=0.7,<1.0",
  "mypy>=1.11,<2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",    # pycodestyle
  "F",         # pyflakes
  "I",         # isort
  "N",         # pep8-naming
  "UP",        # pyupgrade
  "B",         # bugbear
  "A",         # builtins shadowing
  "C4",        # comprehensions
  "SIM",       # simplify
  "TID",       # tidy imports
  "PTH",       # use pathlib
  "RUF",
]
ignore = [
  "B008",  # FastAPI's Depends()/File() defaults are the documented idiom
]

[tool.ruff.lint.per-file-ignores]
# Vendored upstream model architectures are kept close to the original source
# so they can be diffed against upstream; see app/inference/arch/ATTRIBUTION.md.
"app/inference/arch/*" = ["N", "E501", "B", "SIM", "RUF"]
"tests/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
exclude = ['^app/inference/arch/', '^\.venv/', '^alembic/']

[[tool.mypy.overrides]]
# These ship no type stubs.
module = ["cv2.*", "torch.*", "torchvision.*", "sse_starlette.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.inference.arch.*"]
ignore_errors = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
  "slow: real model inference on full-size images; opt in with -m slow",
  "gpu: requires a working CUDA device",
]
